<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrvSniff — wardriving CSV map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0c0e0d;color:#eceeec;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid #eceeec;outline-offset:1px}
header{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#131615;border-bottom:1px solid #262a28}
.brand{font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.loadbtn{background:#eceeec;color:#0c0e0d;font-weight:600;border:1px solid #eceeec;border-radius:3px;padding:7px 12px;cursor:pointer;font:12px/1 inherit;white-space:nowrap}
.loadbtn:hover{background:#c9cdca}
.filebar{color:#9a9e9b;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qstats{margin-left:auto;display:flex;gap:14px;font-size:11px;color:#9a9e9b;white-space:nowrap}
.qstats b{color:#eceeec;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
main{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
#mapwrap{position:relative;min-width:0;overflow:hidden}
#map{position:absolute;inset:0;background:#0c0e0d}
.leaflet-container{background:#0c0e0d;font-family:inherit}
.leaflet-tile-pane{filter:brightness(.94)}
.leaflet-bar{border:1px solid #262a28!important;border-radius:3px!important}
.leaflet-bar a{background:#131615!important;color:#eceeec!important;border-bottom:1px solid #262a28!important;width:28px!important;height:26px!important;line-height:26px!important}
.leaflet-bar a:last-child{border-bottom:none!important}
.leaflet-bar a:hover{background:#1a1e1c!important}
.leaflet-control-attribution{background:rgba(19,22,21,.88)!important;color:#9a9e9b!important;border:1px solid #262a28!important;border-radius:3px!important;font-size:10px!important}
.leaflet-control-attribution a{color:#c7cbc8!important}
.leaflet-control-scale-line{background:rgba(19,22,21,.88)!important;border-color:#9a9e9b!important;color:#eceeec!important;font-family:ui-monospace,monospace!important}
.leaflet-tooltip{background:#131615!important;border:1px solid #3a3f3c!important;color:#eceeec!important;border-radius:3px;font-size:11px;box-shadow:none!important;padding:4px 7px!important}
.leaflet-tooltip-top:before{border-top-color:#3a3f3c!important}
.netdot{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.clustericon{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font:11px/1 ui-monospace,monospace;font-weight:700;color:#eceeec;background:rgba(47,182,115,.22);border:1.5px solid #2fb673}
#legend{position:absolute;left:10px;top:10px;background:#131615;border:1px solid #262a28;border-radius:3px;padding:7px 10px;font-size:11px;display:flex;gap:10px;flex-wrap:wrap;max-width:70%;z-index:1200}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
#status{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;gap:16px;padding:0 10px;background:#131615;border-top:1px solid #262a28;font-size:10.5px;color:#9a9e9b;overflow:hidden;white-space:nowrap;z-index:1200;font-family:ui-monospace,monospace}
#drop{position:absolute;inset:0;background:rgba(12,14,13,.94);border:2px dashed #eceeec;display:none;align-items:center;justify-content:center;font-size:14px;color:#eceeec;z-index:2000;text-align:center;padding:20px}
#drop.on{display:flex}
aside{display:flex;flex-direction:column;background:#101312;border-left:1px solid #262a28;min-height:0}
.sec{border-bottom:1px solid #262a28;padding:10px 12px;flex:0 0 auto}
.sec h2{font-size:11px;font-weight:700;color:#6b716e;margin:0 0 8px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #262a28;background:#131615;color:#9a9e9b;border-radius:3px;padding:5px 9px;font:11px/1 inherit;cursor:pointer}
.chip:hover{border-color:#3a3f3c}
.chip.on{color:#eceeec;border-color:#3a3f3c}
.chip.on[data-k="WIFI"]{border-color:#2fb673;color:#2fb673}
.chip.on[data-k="BLE"]{border-color:#e2a336;color:#e2a336}
.chip.on[data-k="CELL"]{border-color:#9b59b6;color:#9b59b6}
.chip.on[data-k="FLOCK"]{border-color:#3498db;color:#3498db}
.chip.on[data-k="OPEN"]{border-color:#e5484d;color:#e5484d}
#search{width:100%;background:#131615;border:1px solid #262a28;border-radius:3px;color:#eceeec;padding:6px 8px;font:12px inherit;margin-top:8px}
#search:focus{outline:none;border-color:#eceeec}
.tablewrap{flex:1;overflow:auto;min-height:0;padding:0}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
thead th{position:sticky;top:0;background:#101312;text-align:left;padding:6px 8px;color:#6b716e;font-weight:700;border-bottom:1px solid #262a28;cursor:pointer;white-space:nowrap;font-family:-apple-system,sans-serif}
thead th:hover{color:#eceeec}
tbody td{padding:6px 8px;border-bottom:1px solid #191c1b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;cursor:pointer}
tbody tr:hover td{background:#131615}
tbody tr.sel td{background:#1c2a22}
.tyd{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.statline{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:#9a9e9b;font-family:-apple-system,sans-serif}
.statline b{color:#eceeec;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;font-family:ui-monospace,monospace}
.statline.warn b{color:#e5484d}
#closeSel{float:right;cursor:pointer;color:#6b716e;font-family:-apple-system,sans-serif}
#closeSel:hover{color:#eceeec}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:1fr 260px}aside{border-left:0;border-top:1px solid #262a28}}
@media(max-width:600px){.filebar{display:none}header{gap:8px;padding:0 8px}.qstats{gap:8px}}
</style>
</head>
<body>
<header>
  <div class="brand">DrvSniff</div>
  <label class="loadbtn">Load CSV / .gz<input type="file" id="fin" accept=".csv,text/csv,.gz,application/gzip" multiple hidden></label>
  <div class="filebar" id="filebar">sample data — drop WiGLE (.csv or .csv.gz) or wardriving logs</div>
  <div class="qstats" id="qstats"></div>
</header>
<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="legend">
      <span><i class="dot" style="background:#2fb673"></i>WiFi</span>
      <span><i class="dot" style="background:#e5484d"></i>Open WiFi</span>
      <span><i class="dot" style="background:#e2a336"></i>Bluetooth</span>
      <span><i class="dot" style="background:#9b59b6"></i>Cell</span>
      <span><i class="dot" style="background:#3498db"></i>Flock Cam</span>
    </div>
    <div id="status">
      <span id="stCoord">lat — lon —</span>
      <span id="stZoom"></span>
    </div>
    <div id="drop">Drop .csv or .csv.gz file(s) to load</div>
  </div>
  <aside>
    <div class="sec">
      <h2>Filter</h2>
      <div class="toggles">
        <button class="chip on" data-k="WIFI">&#9679; WiFi</button>
        <button class="chip on" data-k="BLE">&#9679; Bluetooth</button>
        <button class="chip on" data-k="CELL">&#9679; Cell</button>
        <button class="chip on" data-k="FLOCK">&#9679; Flock Cam</button>
        <button class="chip" data-k="OPEN">&#9679; Open WiFi only</button>
      </div>
      <input type="text" id="search" placeholder="search SSID or MAC…">
    </div>
    <div class="sec tablewrap">
      <table>
        <thead><tr><th data-s="ssid">Network</th><th data-s="mac">MAC</th><th data-s="rssi">dBm</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="sec" id="statsbox"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
'use strict';
const COLORS={WIFI:'#2fb673',OPEN:'#e5484d',BLE:'#e2a336',CELL:'#9b59b6',FLOCK:'#3498db'};

let all=[], filtered=[];
let selected=null;
let filters={WIFI:true,BLE:true,CELL:true,FLOCK:true,OPENONLY:false};
let searchTerm='';
let sort={key:'rssi',dir:-1};

const SAMPLE=[
['AA:11:22:33:44:01','CafeNet-Guest','[ESS]','2026-05-02 09:14:03',6,-58,40.7420,-73.9930,'WIFI'],
['AA:11:22:33:44:02','HomeWifi_5G','[WPA2-PSK-CCMP][ESS]','2026-05-02 09:14:07',44,-49,40.7423,-73.9925,'WIFI'],
['AA:11:22:33:44:03','Linksys00231','[WEP]','2026-05-02 09:14:22',1,-71,40.7431,-73.9918,'WIFI'],
['C4:BE:11:00:AA:02','Pixel Buds Pro','','2026-05-02 09:14:33',0,-55,40.7427,-73.9920,'BLE'],
['310-410-1234','AT&T LTE','','2026-05-02 09:14:50',0,-85,40.7450,-73.9900,'CELL'],
['C4:BE:11:00:AA:03','LE-Smart Lock','','2026-05-02 09:14:58',0,-62,40.7434,-73.9911,'BLE'],
['FL:0C:K0:00:11:22','flock-os-8273','[WPA2-PSK-CCMP]','2026-05-02 09:15:10',6,-60,40.7410,-73.9910,'FLOCK'],
['C4:BE:11:00:AA:04','','','2026-05-02 09:15:29',0,-74,40.7409,-73.9947,'BLE']
];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isOpen(auth){const a=String(auth||'');if(!a||a==='[ESS]')return true;return !/wpa|wep|psk|eap|sae|8021x|owe|wapi/i.test(a);}
function colorFor(p){
  if(p.type==='BLE') return COLORS.BLE;
  if(p.type==='CELL') return COLORS.CELL;
  if(p.type==='FLOCK') return COLORS.FLOCK;
  return isOpen(p.auth)?COLORS.OPEN:COLORS.WIFI;
}

// ---- map ----
const map=L.map('map',{preferCanvas:true,zoomControl:false,minZoom:2}).setView([20,0],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);
L.control.scale({position:'bottomleft',metric:true,imperial:false}).addTo(map);
const FitControl=L.Control.extend({
  options:{position:'topright'},
  onAdd:function(){
    const div=L.DomUtil.create('div','leaflet-bar');
    const a=L.DomUtil.create('a','',div);
    a.href='#'; a.title='Fit to data'; a.innerHTML='&#10530;';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(a,'click',function(e){L.DomEvent.preventDefault(e);fitData();});
    return div;
  }
});
map.addControl(new FitControl());
map.on('mousemove',e=>{document.getElementById('stCoord').textContent='lat '+e.latlng.lat.toFixed(5)+' lon '+e.latlng.lng.toFixed(5);});
map.on('zoomend',()=>{document.getElementById('stZoom').textContent='z'+map.getZoom();});
document.getElementById('stZoom').textContent='z'+map.getZoom();

const markersLayer=L.markerClusterGroup({
  maxClusterRadius:50,
  spiderfyOnMaxZoom:true,
  iconCreateFunction:function(cluster){
    const n=cluster.getChildCount();
    const size=n<10?30:n<100?36:42;
    return L.divIcon({html:'<div class="clustericon">'+n+'</div>',className:'',iconSize:[size,size]});
  }
}).addTo(map);

function makeIcon(p){
  const c=colorFor(p);
  return L.divIcon({className:'',html:'<span class="netdot" style="background:'+c+'"></span>',iconSize:[10,10],iconAnchor:[5,5]});
}
function rebuildMarkers(){
  markersLayer.clearLayers();
  for(const p of filtered){
    const m=L.marker([p.lat,p.lon],{icon:makeIcon(p)});
    m.bindTooltip(esc(p.ssid||p.mac)+' · '+p.type+(isFinite(p.rssi)?(' · '+p.rssi+' dBm'):''),{direction:'top',offset:[0,-6]});
    m.on('click',()=>selectPoint(p));
    p._marker=m;
    markersLayer.addLayer(m);
  }
}
function fitData(){
  if(!all.length) return;
  map.fitBounds(L.latLngBounds(all.map(p=>[p.lat,p.lon])),{padding:[40,40],maxZoom:17});
}
function selectPoint(p){
  selected=p; renderTable(); updateInfoPanel();
  if(p._marker) markersLayer.zoomToShowLayer(p._marker,function(){});
}

// ---- flexible csv parsing (WiGLE, Ghost ESP-style, generic gps/wifi logs) ----
const FIELD_CANDIDATES={
  lat:['currentlatitude','latitude','lat','gpslatitude'],
  lon:['currentlongitude','longitude','lon','lng','long','gpslongitude'],
  mac:['mac','bssid','address','macaddress','deviceaddress'],
  ssid:['ssid','name','devicename','essid'],
  auth:['authmode','auth','encryption','security','capabilities','privacy'],
  rssi:['rssi','signal','signalstrength','level','power','dbm'],
  chan:['channel','chan','freq','frequency'],
  seen:['firstseen','time','timestamp','datetime','date','lastseen'],
  type:['type','radiotype','devicetype','kind']
};
function normHeader(h){return (h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');}
function buildIndex(headerRow){
  const norm=headerRow.map(normHeader);
  const idx={};
  for(const f in FIELD_CANDIDATES){
    idx[f]=-1;
    for(const cand of FIELD_CANDIDATES[f]){const i=norm.indexOf(cand); if(i>=0){idx[f]=i;break;}}
  }
  return idx;
}
function detectDelim(line){
  const c=(line.match(/,/g)||[]).length, s=(line.match(/;/g)||[]).length;
  return s>c?';':',';
}
function parseCSVtext(text,delim){
  const rows=[]; let row=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else {
      if(c==='"') q=true;
      else if(c===delim){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}
function parseCSVFile(text){
  const trimmed=text.trim();
  if(!trimmed) return [];
  const lines=trimmed.split('\n');
  let hi=0;
  const firstCellRaw=(lines[0].split(/[,;]/)[0]||'');
  if(/^wiglewifi/i.test(firstCellRaw) || lines[0].trim().startsWith('#')) hi=1;
  const delim=detectDelim(lines[hi]||lines[0]);
  const rows=parseCSVtext(trimmed+'\n',delim);
  if(!rows[hi]) return [];
  const I=buildIndex(rows[hi]);
  if(I.lat<0||I.lon<0) return [];
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||r.length<2) continue;
    const lat=parseFloat(r[I.lat]), lon=parseFloat(r[I.lon]);
    if(!isFinite(lat)||!isFinite(lon)||(lat===0&&lon===0)) continue;
    let rawType=(I.type>=0?(r[I.type]||''):'').trim().toUpperCase();
    const ssid=(I.ssid>=0?r[I.ssid]:'').trim()||'(hidden)';
    
    let type;
    if(/BLE|BLUETOOTH|^BT$/i.test(rawType)) type='BLE';
    else if(/GSM|LTE|CDMA|WCDMA|UMTS|NR/i.test(rawType)) type='CELL';
    else if(rawType===''||rawType==='WIFI'||rawType==='WLAN') type='WIFI';
    else type='WIFI'; // Default assumption if type col exists but is unrecognized
    
    // Override logic for specific fingerprinting (e.g. Flock Safety Cameras)
    if(/^flock/i.test(ssid) || /flock-os/i.test(ssid)) {
        type='FLOCK';
    }

    out.push({
      mac:(I.mac>=0?r[I.mac]:'').trim(),
      ssid:ssid,
      auth:(I.auth>=0?r[I.auth]:'').trim(),
      seen:(I.seen>=0?r[I.seen]:'').trim(),
      chan:I.chan>=0?r[I.chan]:'',
      rssi:I.rssi>=0?parseFloat(r[I.rssi]):NaN,
      lat:lat,lon:lon,type:type,obs:1
    });
  }
  return out;
}
function dedupe(recs){
  const map2=new Map();
  for(const rec of recs){
    const k=(rec.mac||(rec.lat+','+rec.lon))+'|'+rec.type;
    const cur=map2.get(k);
    if(!cur) map2.set(k,rec);
    else { cur.obs=(cur.obs||1)+1; if((rec.rssi||-999)>(cur.rssi||-999)){const o=cur.obs;Object.assign(cur,rec);cur.obs=o;} }
  }
  return [...map2.values()];
}

// Support natively decompressing .gz using standard browser APIs
async function readFile(f){
  if(f.name.toLowerCase().endsWith('.gz')){
    try {
      const ds = new DecompressionStream('gzip');
      const stream = f.stream().pipeThrough(ds);
      return await new Response(stream).text();
    } catch(e) {
      console.error("Gzip decompression failed", e);
      throw e;
    }
  }
  return await f.text();
}

function loadSample(){
  all=SAMPLE.map(r=>({mac:r[0],ssid:r[1]||'(hidden)',auth:r[2],seen:r[3],chan:r[4],rssi:r[5],lat:r[6],lon:r[7],type:r[8],obs:1}));
  document.getElementById('filebar').textContent='sample data — drop WiGLE (.csv or .csv.gz) or wardriving logs';
  afterLoad();
}
function handleFiles(fileList){
  const files=[...fileList].filter(f=>/\.csv(\.gz)?$/i.test(f.name));
  if(!files.length) return;
  document.getElementById('filebar').textContent='parsing '+files.length+' file(s)…';
  
  Promise.all(files.map(readFile)).then(texts=>{
    let recs=[];
    texts.forEach(t=>{recs=recs.concat(parseCSVFile(t));});
    if(!recs.length){
        alert('No rows with valid GPS coordinates were recognized in the selected file(s).');
        document.getElementById('filebar').textContent=files.map(f=>f.name).join(', ');
        return;
    }
    all=dedupe(recs);
    document.getElementById('filebar').textContent=files.map(f=>f.name).join(', ');
    afterLoad();
  }).catch((e)=>{
      console.error(e);
      alert('Could not read or decompress the selected file(s).');
      document.getElementById('filebar').textContent='Error loading files';
  });
}
document.getElementById('fin').addEventListener('change',e=>handleFiles(e.target.files));
const mapwrap=document.getElementById('mapwrap'), dropEl=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>mapwrap.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('on');}));
mapwrap.addEventListener('dragleave',e=>{e.preventDefault();dropEl.classList.remove('on');});
mapwrap.addEventListener('drop',e=>{e.preventDefault();dropEl.classList.remove('on');if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});

function afterLoad(){
  selected=null;
  applyFilters(); updateHeaderStats(); rebuildMarkers(); renderTable(); updateInfoPanel(); fitData();
}
function updateHeaderStats(){
  const wifi=all.filter(p=>p.type==='WIFI').length, 
        ble=all.filter(p=>p.type==='BLE').length,
        cell=all.filter(p=>p.type==='CELL').length,
        flock=all.filter(p=>p.type==='FLOCK').length;
  document.getElementById('qstats').innerHTML=
    '<span><b>'+all.length+'</b> total</span>'+
    '<span><b>'+wifi+'</b> wifi</span>'+
    '<span><b>'+ble+'</b> bt</span>'+
    (cell>0 ? '<span><b>'+cell+'</b> cell</span>' : '')+
    (flock>0 ? '<span><b>'+flock+'</b> flock</span>' : '');
}
function applyFilters(){
  filtered=all.filter(p=>{
    if(p.type==='WIFI'&&!filters.WIFI) return false;
    if(p.type==='BLE'&&!filters.BLE) return false;
    if(p.type==='CELL'&&!filters.CELL) return false;
    if(p.type==='FLOCK'&&!filters.FLOCK) return false;
    if(filters.OPENONLY && !(p.type==='WIFI'&&isOpen(p.auth))) return false;
    if(searchTerm && !((p.ssid||'').toLowerCase().includes(searchTerm)||(p.mac||'').toLowerCase().includes(searchTerm))) return false;
    return true;
  });
  sortFiltered();
}
function sortFiltered(){
  const key=sort.key, dir=sort.dir;
  filtered.sort((a,b)=>{
    let av=a[key],bv=b[key];
    if(typeof av==='string'){av=av.toLowerCase();bv=(bv||'').toLowerCase();return av<bv?-1*dir:av>bv?1*dir:0;}
    return ((av||0)-(bv||0))*dir;
  });
}
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    const k=ch.dataset.k;
    if(k==='OPEN'){filters.OPENONLY=!filters.OPENONLY;ch.classList.toggle('on',filters.OPENONLY);}
    else {filters[k]=!filters[k];ch.classList.toggle('on',filters[k]);}
    applyFilters();rebuildMarkers();renderTable();updateInfoPanel();
  });
});
document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.trim().toLowerCase();
  applyFilters();rebuildMarkers();renderTable();updateInfoPanel();
});
document.querySelectorAll('thead th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.s;
    if(sort.key===k) sort.dir*=-1; else {sort.key=k;sort.dir=k==='ssid'?1:-1;}
    sortFiltered();renderTable();
  });
});

function renderTable(){
  const tb=document.getElementById('tbody');
  const rows=filtered.slice(0,400);
  tb.innerHTML=rows.map((p,i)=>
    '<tr data-i="'+i+'" class="'+(p===selected?'sel':'')+'">'+
    '<td><span class="tyd" style="background:'+colorFor(p)+'"></span>'+esc(p.ssid)+'</td>'+
    '<td>'+esc(p.mac)+'</td>'+
    '<td>'+(isFinite(p.rssi)?p.rssi:'—')+'</td></tr>'
  ).join('')+(filtered.length>400?'<tr><td colspan="3" style="color:#6b716e;text-align:center;cursor:default">+'+(filtered.length-400)+' more — narrow with filters or search</td></tr>':'');
  tb.querySelectorAll('tr[data-i]').forEach(tr=>{
    tr.addEventListener('click',()=>{ selectPoint(rows[+tr.dataset.i]); });
  });
}

function updateInfoPanel(){
  const box=document.getElementById('statsbox');
  if(selected){
    const p=selected;
    box.innerHTML='<h2>Selected <span id="closeSel">&#10005;</span></h2>'+
      '<div class="statline"><span>Network</span><b>'+esc(p.ssid)+'</b></div>'+
      '<div class="statline"><span>MAC / ID</span><b>'+esc(p.mac||'—')+'</b></div>'+
      '<div class="statline"><span>Type</span><b>'+p.type+'</b></div>'+
      '<div class="statline"><span>Security</span><b>'+(p.type==='WIFI'?(isOpen(p.auth)?'OPEN':esc(p.auth||'secured')):'—')+'</b></div>'+
      '<div class="statline"><span>Channel</span><b>'+esc(p.chan||'—')+'</b></div>'+
      '<div class="statline"><span>RSSI</span><b>'+(isFinite(p.rssi)?p.rssi+' dBm':'—')+'</b></div>'+
      '<div class="statline"><span>First seen</span><b>'+esc(p.seen||'—')+'</b></div>'+
      '<div class="statline"><span>Position</span><b>'+p.lat.toFixed(5)+', '+p.lon.toFixed(5)+'</b></div>'+
      '<div class="statline"><span>Observations</span><b>'+(p.obs||1)+'</b></div>';
    document.getElementById('closeSel').onclick=()=>{selected=null;renderTable();updateInfoPanel();};
  } else {
    const wifi=all.filter(p=>p.type==='WIFI').length, 
          ble=all.filter(p=>p.type==='BLE').length,
          cell=all.filter(p=>p.type==='CELL').length,
          flock=all.filter(p=>p.type==='FLOCK').length;
    const open=all.filter(p=>p.type==='WIFI'&&isOpen(p.auth)).length;
    box.innerHTML='<h2>Summary</h2>'+
      '<div class="statline"><span>Unique nodes</span><b>'+all.length+'</b></div>'+
      '<div class="statline"><span>WiFi</span><b>'+wifi+'</b></div>'+
      '<div class="statline"><span>Bluetooth</span><b>'+ble+'</b></div>'+
      '<div class="statline"><span>Cell Towers</span><b>'+cell+'</b></div>'+
      '<div class="statline"><span>Flock Cams</span><b>'+flock+'</b></div>'+
      '<div class="statline warn"><span>Open WiFi</span><b>'+open+'</b></div>'+
      '<div class="statline" style="margin-top:8px;border-top:1px solid #262a28;padding-top:8px"><span>Shown</span><b>'+filtered.length+'</b></div>';
  }
}

loadSample();
})();
</script>
</body>
</html>
