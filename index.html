<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DrvSniff — wardriving map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3aKf2z0s0VjJw8k2nS1p8mE7m0r5s=" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#111516;--panel:#191f20;--panel2:#202829;--line:#394344;--text:#e6ecea;--muted:#91a09d;--green:#52d19c;--amber:#e7ae58;--red:#ef6b68;--cyan:#6fc7cf}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;display:flex;flex-direction:column;overflow:hidden}button,input{font:inherit;color:inherit}button{cursor:pointer}.topbar{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.brand b{color:var(--green)}.sub{color:var(--muted);font-size:11px;border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}.actions{margin-left:auto;display:flex;gap:7px}.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 10px;border-radius:2px;white-space:nowrap}.btn:hover{border-color:var(--green)}.btn.primary{background:var(--green);border-color:var(--green);color:#082018;font-weight:800}.btn:disabled{opacity:.5;cursor:not-allowed}.metrics{display:flex;gap:14px;color:var(--muted);white-space:nowrap;font-size:11px}.metrics strong{color:var(--text)}.status{color:var(--muted);font-size:10px}.status.loading{color:var(--amber)}.status.error{color:var(--red)}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}#map{min-width:0;background:#c9d1d0}.side{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}.toolbar{padding:10px;border-bottom:1px solid var(--line)}.toolbar h1{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin:0 0 8px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;color:var(--muted);font-size:11px}.filter.active{color:var(--text);border-color:var(--green)}.filter[data-filter="open"].active{border-color:var(--red);color:var(--red)}.search{width:100%;margin-top:8px;padding:7px 8px;background:#101516;border:1px solid var(--line);border-radius:2px;font-size:11px}.search:focus{outline:1px solid var(--green)}.importnote{margin-top:8px;color:var(--muted);font-size:10px}.tablebox{flex:1;min-height:0;overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;background:var(--panel);color:var(--muted);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:7px 9px;border-bottom:1px solid var(--line);z-index:2;cursor:pointer}th:hover{color:var(--green)}th:nth-child(1){width:44%}th:nth-child(2){width:34%}th:nth-child(3){width:22%}td{padding:7px 9px;border-bottom:1px solid #293132;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}tr{cursor:pointer}tr:hover td,tr.selected td{background:#273333}tr.selected td:first-child{box-shadow:inset 3px 0 var(--green)}.details{border-top:1px solid var(--line);padding:10px;min-height:150px}.details h2{font-size:11px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:10px}.row span{color:var(--muted)}.row b{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.warn{color:var(--red)}.leaflet-container{font:11px ui-monospace,SFMono-Regular,Consolas,monospace}.leaflet-control-zoom a,.leaflet-control-layers{background:var(--panel)!important;color:var(--text)!important;border-color:var(--line)!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--line)}.leaflet-popup-content{margin:10px;font-size:11px}.popup-title{font-weight:800;margin-bottom:5px}.popup-row{color:var(--muted);padding:2px 0;font-size:10px}.popup-row b{color:var(--text)}.leaflet-control-attribution{font-size:9px}.drop{display:none;position:absolute;inset:0;z-index:1000;align-items:center;justify-content:center;background:rgba(17,21,22,.88);border:2px dashed var(--green);color:var(--green);font-size:14px;pointer-events:none}.drop.on{display:flex}.mapwrap{position:relative;min-height:0}@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:1fr 330px}.side{border-left:0;border-top:1px solid var(--line)}.sub{display:none}.metrics{display:none}}@media(max-width:520px){.topbar{padding:0 9px;gap:8px}.brand{font-size:14px}.btn{padding:6px 7px;font-size:11px}.side{font-size:10px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">DrvSniff <b>//</b></div><div class="sub">WARDIVING / RF INVENTORY</div><div class="actions"><label class="btn primary" id="importBtn">Import CSV / GZ<input id="files" type="file" accept=".csv,.csv.gz,.gz,.txt,text/csv,text/plain,application/gzip" multiple hidden></label><button class="btn" id="fit">Fit data</button></div><div class="metrics"><span id="status" class="status">ready</span><span><strong id="totalCount">0</strong> total</span><span><strong id="shownCount">0</strong> shown</span></div></header>
<main><section class="mapwrap"><div id="map"></div><div class="drop" id="drop">Drop capture files (.csv, .csv.gz) to import</div></section><aside class="side"><section class="toolbar"><h1>Capture inventory</h1><div class="filters"><button class="filter active" data-filter="wifi">📡 WiFi <span id="wifiCount">0</span></button><button class="filter active" data-filter="ble">🔌 BLE <span id="bleCount">0</span></button><button class="filter" data-filter="open">⚠ Open</button></div><input class="search" id="search" placeholder="Filter SSID, BSSID, vendor…" autocomplete="off"><div class="importnote" id="source">Built-in sample · CSV/GZ stays in your browser</div></section><section class="tablebox"><table><thead><tr><th data-sort="ssid">Network</th><th data-sort="mac">BSSID</th><th data-sort="rssi">RSSI</th></tr></thead><tbody id="rows"></tbody></table></section><section class="details" id="details"></section></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={wifi:'#52d19c',open:'#ef6b68',ble:'#e7ae58'};let records=[],shown=[],selected=null,markers=[],sortKey='rssi',sortDir=-1,state={wifi:true,ble:true,open:false,query:''};

const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([40.742,-73.993],15);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors',minZoom:2}).addTo(map);

const sample=[
['AA:11:22:33:44:01','CafeNet-Guest','[ESS]',-58,40.7420,-73.9930,'WIFI'],
['AA:11:22:33:44:02','HomeWifi_5G','[WPA2-PSK-CCMP][ESS]',-49,40.7423,-73.9925,'WIFI'],
['AA:11:22:33:44:03','Linksys00231','[WEP]',-71,40.7431,-73.9918,'WIFI'],
['AA:11:22:33:44:04','xfinitywifi','[ESS]',-66,40.7438,-73.9906,'WIFI'],
['AA:11:22:33:44:05','Corporate-Guest','[WPA3-SAE-CCMP][ESS]',-54,40.7405,-73.9952,'WIFI'],
['C4:BE:11:00:AA:01','Pixel Buds Pro','',-55,40.7427,-73.9920,'BLE'],
['C4:BE:11:00:AA:02','LE-Smart Lock','',-62,40.7434,-73.9911,'BLE']
];

function openNet(r){return r.type==='WIFI'&&!/wpa|wep|psk|eap|sae|8021x|owe|wapi/i.test(r.auth||'')}
function status(msg,cls=''){$('#status').textContent=msg;$('#status').className='status '+cls}
function parseCSV(text){let out=[],row=[],f='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);out.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f||row.length){row.push(f);out.push(row)}return out}

function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}

function parseFile(text){let rows=parseCSV(text.trim()+'\n');if(!rows.length)return[];let headerAt=rows.findIndex(r=>r.some(v=>/mac|bssid|latitude|longitude|currentlatitude/i.test(v)));if(headerAt<0)headerAt=0;let h=rows[headerAt].map(norm),find=(...names)=>{for(const n of names){let i=h.indexOf(norm(n));if(i>=0)return i}return -1};let I={mac:find('mac','bssid','bssidmac','address'),ssid:find('ssid','essid','networkname','name'),auth:find('authmode','encryption','privacy','security'),rssi:find('rssi','signal','signaldbm','power','signaldBm'),lat:find('currentlatitude','latitude','lat','gps_lat'),lon:find('currentlongitude','longitude','lon','lng','gps_lng'),chan:find('channel','chan','frequency'),seen:find('firstseen','lastseen','timestamp','time','datetime'),type:find('type','kind','radiotype')};let result=[];for(let i=headerAt+1;i<rows.length;i++){let r=rows[i],lat=parseFloat(r[I.lat]),lon=parseFloat(r[I.lon]);if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180||(lat===0&&lon===0))continue;let type=I.type>=0&&/ble|bluetooth/i.test(r[I.type])?'BLE':'WIFI';result.push({mac:(r[I.mac]||'unknown').trim(),ssid:(r[I.ssid]||'(hidden)').trim()||'(hidden)',auth:(r[I.auth]||'').trim(),rssi:parseFloat(r[I.rssi]),lat,lon,chan:I.chan>=0?r[I.chan]:'',seen:I.seen>=0?r[I.seen]:'',type,obs:1})}return result}

function dedupe(a){let m=new Map;for(const r of a){let k=(r.mac||'').toLowerCase()+'|'+r.type;if(m.has(k)){let x=m.get(k);x.obs++;if(isFinite(r.rssi)&&(!isFinite(x.rssi)||r.rssi>x.rssi))Object.assign(x,r,{obs:x.obs})}else m.set(k,r)}return [...m.values()]}

async function read(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=async()=>{try{let text=r.result;if(f.name.endsWith('.gz')||f.type==='application/gzip'){try{let binary=new Uint8Array(text);text=pako.inflate(binary,{to:'string'})}catch(e){return no(new Error('Failed to decompress: '+e.message))}}ok(text)}catch(e){no(e)}};r.onerror=no;if(f.name.endsWith('.gz')){r.readAsArrayBuffer(f)}else{r.readAsText(f)}})}

function apply(){let q=state.query;shown=records.filter(r=>(r.type==='WIFI'?state.wifi:state.ble)&&(!state.open||openNet(r))&&(!q||[r.ssid,r.mac,r.auth].join(' ').toLowerCase().includes(q)));shown.sort((a,b)=>{let x=a[sortKey]??'',y=b[sortKey]??'';return typeof x==='string'?x.localeCompare(y)*sortDir:((x||-999)-(y||-999))*sortDir});renderMarkers();renderRows();renderDetails();updateMetrics()}

function renderMarkers(){markers.forEach(m=>m.remove());markers=[];shown.forEach(r=>{let c=openNet(r)?colors.open:(r.type==='BLE'?colors.ble:colors.wifi);let m=L.circleMarker([r.lat,r.lon],{radius:r===selected?8:5,weight:r===selected?3:1,color:'#101516',fillColor:c,fillOpacity:.9}).addTo(map);m.bindPopup(`<div class="popup-title">${esc(r.ssid)}</div><div class="popup-row">${esc(r.type)} · <b>${esc(r.mac)}</b></div><div class="popup-row">RSSI <b>${isFinite(r.rssi)?r.rssi+' dBm':'—'}</b> · ${openNet(r)?'<b class="warn">OPEN</b>':'secured'}</div><div class="popup-row">${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}</div>`);m.on('click',()=>{selected=r;apply()});markers.push(m)})}

function renderRows(){let visible=shown.slice(0,500);$('#rows').innerHTML=visible.map(r=>`<tr class="${r===selected?'selected':''}" data-idx="${shown.indexOf(r)}"><td><i class="mark" style="background:${openNet(r)?colors.open:r.type==='BLE'?colors.ble:colors.wifi}"></i>${esc(r.ssid)}</td><td>${esc(r.mac)}</td><td>${isFinite(r.rssi)?r.rssi:'—'}</td></tr>`).join('')+(shown.length>500?`<tr><td colspan="3">+${shown.length-500} more records; refine filter</td></tr>`:''');$$('#rows tr[data-idx]').forEach(tr=>tr.onclick=()=>{let idx=+tr.dataset.idx;if(shown[idx]){selected=shown[idx];map.setView([selected.lat,selected.lon],Math.max(map.getZoom(),16));apply()}})}

function renderDetails(){let d=$('#details');if(!selected){let open=records.filter(openNet).length;d.innerHTML=`<h2>Dataset summary</h2><div class="row"><span>Loaded records</span><b>${records.length}</b></div><div class="row"><span>Open WiFi</span><b class="warn">${open}</b></div><div class="row"><span>Shown now</span><b>${shown.length}</b></div>`;return}d.innerHTML=`<h2>Selected network</h2><div class="row"><span>SSID</span><b>${esc(selected.ssid)}</b></div><div class="row"><span>MAC</span><b>${esc(selected.mac)}</b></div><div class="row"><span>Type</span><b>${selected.type}</b></div><div class="row"><span>Security</span><b class="${openNet(selected)?'warn':''}">${selected.type==='BLE'?'—':openNet(selected)?'OPEN':esc(selected.auth||'secured')}</b></div><div class="row"><span>Position</span><b>${selected.lat.toFixed(5)}, ${selected.lon.toFixed(5)}</b></div><div class="row"><span>Observations</span><b>${selected.obs}</b></div>`}

function updateMetrics(){$('#totalCount').textContent=records.length;$('#shownCount').textContent=shown.length;$('#wifiCount').textContent=records.filter(r=>r.type==='WIFI').length;$('#bleCount').textContent=records.filter(r=>r.type==='BLE').length}

function fit(){if(!records.length){status('no data to fit','error');return}let b=L.latLngBounds(records.map(r=>[r.lat,r.lon]));map.fitBounds(b,{padding:[28,28],maxZoom:17});status('fitted')}

$('#files').onchange=e=>importFiles(e.target.files);

async function importFiles(fs){let files=[...fs].filter(f=>/\.(csv|gz)$/i.test(f.name)||f.type.includes('gzip'));if(!files.length){status('no .csv or .gz files selected','error');return}status(`reading ${files.length} file(s)…`,'loading');try{let parsed=[];for(const f of files){try{let txt=await read(f);let p=parseFile(txt);parsed=parsed.concat(p);status(`parsed ${f.name}: ${p.length} nets`,'loading')}catch(e){console.error(f.name,e);status(`error: ${f.name}`,
'error')}}if(!parsed.length){status('no valid GPS rows found','error');return}records=dedupe(parsed);selected=null;$('#source').textContent=files.map(f=>f.name).join(', ')+' · '+records.length+' networks';apply();fit();status('ready','')}catch(e){console.error(e);status('import failed: '+e.message,'error')}}

for(const b of $$('.filter'))b.onclick=()=>{let k=b.dataset.filter;if(k==='open')state.open=!state.open;else state[k]=!state[k];b.classList.toggle('active',state[k]);apply()};

$('#search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();apply()};

$$('th').forEach(th=>th.onclick=()=>{let k=th.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='ssid'?1:-1}apply()});

$('#fit').onclick=fit;

let wrap=$('.mapwrap'),drop=$('#drop');
['dragenter','dragover'].forEach(e=>wrap.addEventListener(e,x=>{x.preventDefault();drop.classList.add('on')}));
wrap.addEventListener('dragleave',()=>drop.classList.remove('on'));
wrap.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('on');importFiles(e.dataTransfer.files)});

records=dedupe(sample.map(r=>({mac:r[0],ssid:r[1],auth:r[2],rssi:r[3],lat:r[4],lon:r[5],type:r[6],chan:'',seen:'',obs:1})));
apply();
fit();
status('ready','');
</script>
</body>
</html>
