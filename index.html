<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wardrive:// — WiGLE CSV map</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#0a0f0d;color:#e7f3ec;font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid #33d6a0;outline-offset:1px}
header{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#121a17;border-bottom:1px solid #24352f}
.brand{font-weight:700;font-size:14px;white-space:nowrap}
.brand span{color:#33d6a0}
.loadbtn{background:#33d6a0;color:#042016;font-weight:700;border:1px solid #33d6a0;border-radius:3px;padding:7px 12px;cursor:pointer;font:12px/1 inherit;white-space:nowrap}
.loadbtn:hover{background:#5fe4b8}
.filebar{color:#8fa89d;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qstats{margin-left:auto;display:flex;gap:14px;font-size:11px;color:#8fa89d;white-space:nowrap}
.qstats b{color:#e7f3ec}
main{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
#mapwrap{position:relative;min-width:0;overflow:hidden;background:#0a0f0d}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.grabbing{cursor:grabbing}
#legend{position:absolute;left:10px;top:10px;background:#121a17;border:1px solid #24352f;border-radius:3px;padding:7px 10px;font-size:11px;display:flex;gap:10px;flex-wrap:wrap;max-width:78%}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
#zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border:1px solid #24352f;border-radius:3px;overflow:hidden}
#zoomctl button{width:28px;height:26px;background:#121a17;color:#e7f3ec;border:0;border-bottom:1px solid #24352f;cursor:pointer;font:14px/1 inherit}
#zoomctl button:last-child{border-bottom:0}
#zoomctl button:hover{background:#0e1513}
#tooltip{position:absolute;pointer-events:none;background:#0e1513;border:1px solid #3a4d44;border-radius:3px;padding:8px 10px;font-size:11px;max-width:230px;display:none;z-index:5}
#tooltip .tt-ssid{font-weight:700;margin-bottom:3px;word-break:break-all;color:#e7f3ec}
#tooltip div{color:#8fa89d}
#status{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;gap:16px;padding:0 10px;background:#121a17;border-top:1px solid #24352f;font-size:10.5px;color:#8fa89d;overflow:hidden;white-space:nowrap}
#drop{position:absolute;inset:0;background:rgba(10,15,13,.94);border:2px dashed #33d6a0;display:none;align-items:center;justify-content:center;font-size:14px;color:#33d6a0;z-index:9;text-align:center;padding:20px}
#drop.on{display:flex}
aside{display:flex;flex-direction:column;background:#0d1412;border-left:1px solid #24352f;min-height:0}
.sec{border-bottom:1px solid #24352f;padding:10px 12px;flex:0 0 auto}
.sec h2{font-size:11px;font-weight:700;color:#5f776e;margin:0 0 8px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #24352f;background:#121a17;color:#8fa89d;border-radius:3px;padding:5px 9px;font:11px/1 inherit;cursor:pointer}
.chip:hover{border-color:#3a4d44}
.chip.on{color:#e7f3ec;border-color:#3a4d44}
.chip.on[data-k="WIFI"]{border-color:#33d6a0;color:#33d6a0}
.chip.on[data-k="BLE"]{border-color:#ffb238;color:#ffb238}
.chip.on[data-k="OPEN"]{border-color:#ff5c5c;color:#ff5c5c}
#search{width:100%;background:#121a17;border:1px solid #24352f;border-radius:3px;color:#e7f3ec;padding:6px 8px;font:12px inherit;margin-top:8px}
#search:focus{outline:none;border-color:#33d6a0}
.tablewrap{flex:1;overflow:auto;min-height:0;padding:0}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{position:sticky;top:0;background:#0d1412;text-align:left;padding:6px 8px;color:#5f776e;font-weight:700;border-bottom:1px solid #24352f;cursor:pointer;white-space:nowrap}
thead th:hover{color:#e7f3ec}
tbody td{padding:6px 8px;border-bottom:1px solid #182420;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;cursor:pointer}
tbody tr:hover td{background:#121a17}
tbody tr.sel td{background:#173028}
.tyd{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.statline{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:#8fa89d}
.statline b{color:#e7f3ec;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.statline.warn b{color:#ff5c5c}
#closeSel{float:right;cursor:pointer;color:#5f776e}
#closeSel:hover{color:#e7f3ec}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:1fr 260px}aside{border-left:0;border-top:1px solid #24352f}}
@media(max-width:600px){.filebar{display:none}header{gap:8px;padding:0 8px}.qstats{gap:8px}}
</style>
</head>
<body>
<header>
  <div class="brand">wardrive<span>://</span></div>
  <label class="loadbtn">⇪ Load CSV<input type="file" id="fin" accept=".csv,text/csv" multiple hidden></label>
  <div class="filebar" id="filebar">sample data — load a WiGLE v1.6 export to replace it</div>
  <div class="qstats" id="qstats"></div>
</header>
<main>
  <div id="mapwrap">
    <canvas id="cv"></canvas>
    <div id="legend">
      <span><i class="dot" style="background:#33d6a0"></i>WiFi secured</span>
      <span><i class="dot" style="background:#ff5c5c"></i>WiFi open</span>
      <span><i class="dot" style="background:#ffb238"></i>BLE</span>
    </div>
    <div id="zoomctl">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&minus;</button>
      <button id="zfit" title="Fit to data">&#10530;</button>
    </div>
    <div id="tooltip"></div>
    <div id="status">
      <span id="stCoord">lat — lon —</span>
      <span id="stZoom"></span>
      <span id="stVis"></span>
    </div>
    <div id="drop">Drop WiGLE CSV file(s) to load</div>
  </div>
  <aside>
    <div class="sec">
      <h2>Filter</h2>
      <div class="toggles">
        <button class="chip on" data-k="WIFI">&#9679; WiFi</button>
        <button class="chip on" data-k="BLE">&#9679; BLE</button>
        <button class="chip" data-k="OPEN">&#9679; Open only</button>
      </div>
      <input type="text" id="search" placeholder="search SSID or MAC…">
    </div>
    <div class="sec tablewrap">
      <table>
        <thead><tr><th data-s="ssid">Network</th><th data-s="mac">MAC</th><th data-s="rssi">dBm</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="sec" id="statsbox"></div>
  </aside>
</main>
<script>
(function(){
'use strict';
const BG='#0a0f0d';
const COLORS={WIFI:'#33d6a0',OPEN:'#ff5c5c',BLE:'#ffb238'};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const DPR=Math.max(1,window.devicePixelRatio||1);
const TS=256;

let all=[], filtered=[];
let view={cx:0,cy:0,zoom:15};
let selected=null, hover=null;
let filters={WIFI:true,BLE:true,OPENONLY:false};
let searchTerm='';
let sort={key:'rssi',dir:-1};
let dragging=false,lastX=0,lastY=0,moved=false;

const SAMPLE=[
['AA:11:22:33:44:01','CafeNet-Guest','[ESS]','2026-05-02 09:14:03',6,-58,40.7420,-73.9930,'WIFI'],
['AA:11:22:33:44:02','HomeWifi_5G','[WPA2-PSK-CCMP][ESS]','2026-05-02 09:14:07',44,-49,40.7423,-73.9925,'WIFI'],
['AA:11:22:33:44:03','Linksys00231','[WEP]','2026-05-02 09:14:22',1,-71,40.7431,-73.9918,'WIFI'],
['AA:11:22:33:44:04','xfinitywifi','[ESS]','2026-05-02 09:14:40',11,-66,40.7438,-73.9906,'WIFI'],
['AA:11:22:33:44:05','FrontDesk-5G','[WPA2-PSK-CCMP][ESS]','2026-05-02 09:15:02',6,-77,40.7412,-73.9941,'WIFI'],
['AA:11:22:33:44:06','ATT-9F3','[WPA3-SAE-CCMP][ESS]','2026-05-02 09:15:20',153,-54,40.7405,-73.9952,'WIFI'],
['AA:11:22:33:44:07','','[ESS]','2026-05-02 09:15:41',6,-81,40.7446,-73.9899,'WIFI'],
['AA:11:22:33:44:08','printer-office','[WPA2-PSK-CCMP][ESS]','2026-05-02 09:16:01',36,-63,40.7398,-73.9962,'WIFI'],
['C4:BE:11:00:AA:01','','','2026-05-02 09:14:15',0,-70,40.7419,-73.9928,'BLE'],
['C4:BE:11:00:AA:02','Pixel Buds Pro','','2026-05-02 09:14:33',0,-55,40.7427,-73.9920,'BLE'],
['C4:BE:11:00:AA:03','LE-Smart Lock','','2026-05-02 09:14:58',0,-62,40.7434,-73.9911,'BLE'],
['C4:BE:11:00:AA:04','','','2026-05-02 09:15:29',0,-74,40.7409,-73.9947,'BLE'],
['C4:BE:11:00:AA:05','Fitbit Charge','','2026-05-02 09:15:50',0,-59,40.7442,-73.9903,'BLE']
];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function isOpen(auth){const a=String(auth||'');if(!a||a==='[ESS]')return true;return !/wpa|wep|psk|eap|sae|8021x|owe|wapi/i.test(a);}
function colorFor(p){if(p.type==='BLE')return COLORS.BLE;return isOpen(p.auth)?COLORS.OPEN:COLORS.WIFI;}

function project(lat,lon,z){
  const s=TS*Math.pow(2,z);
  const x=(lon+180)/360*s;
  const lr=lat*Math.PI/180;
  const y=(0.5-Math.log(Math.tan(Math.PI/4+lr/2))/(2*Math.PI))*s;
  return {x:x,y:y};
}
function unproject(sx,sy){
  const w=cv.width/DPR,h=cv.height/DPR;
  const px=view.cx+(sx-w/2), py=view.cy+(sy-h/2);
  const s=TS*Math.pow(2,view.zoom);
  const lon=px/s*360-180;
  const n=Math.PI-2*Math.PI*py/s;
  const lat=180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return {lat:lat,lon:lon};
}

function parseCSVtext(text){
  const rows=[]; let row=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else {
      if(c==='"') q=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}
function parseWigle(text){
  const rows=parseCSVtext(text.trim()+'\n');
  if(!rows.length) return [];
  let hi=0;
  if(rows[0][0] && /^wiglewifi/i.test(rows[0][0])) hi=1;
  if(!rows[hi]) return [];
  const header=rows[hi].map(h=>(h||'').trim().toLowerCase());
  const ix=n=>header.indexOf(n);
  const I={mac:ix('mac'),ssid:ix('ssid'),auth:ix('authmode'),seen:ix('firstseen'),chan:ix('channel'),rssi:ix('rssi'),lat:ix('currentlatitude'),lon:ix('currentlongitude'),type:ix('type')};
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||r.length<3) continue;
    const lat=parseFloat(r[I.lat]), lon=parseFloat(r[I.lon]);
    if(!isFinite(lat)||!isFinite(lon)||(lat===0&&lon===0)) continue;
    const type=(I.type>=0?(r[I.type]||'WIFI'):'WIFI').trim().toUpperCase();
    if(type!=='WIFI'&&type!=='BLE') continue;
    out.push({mac:(r[I.mac]||'').trim(),ssid:(r[I.ssid]||'').trim()||'(hidden)',auth:(r[I.auth]||'').trim(),seen:(r[I.seen]||'').trim(),chan:I.chan>=0?r[I.chan]:'',rssi:parseFloat(r[I.rssi]),lat:lat,lon:lon,type:type,obs:1});
  }
  return out;
}
function dedupe(recs){
  const map=new Map();
  for(const rec of recs){
    const k=rec.mac+'|'+rec.type;
    const cur=map.get(k);
    if(!cur) map.set(k,rec);
    else { cur.obs=(cur.obs||1)+1; if(rec.rssi>cur.rssi){const o=cur.obs;Object.assign(cur,rec);cur.obs=o;} }
  }
  return [...map.values()];
}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f);});}

function loadSample(){
  all=SAMPLE.map(r=>({mac:r[0],ssid:r[1]||'(hidden)',auth:r[2],seen:r[3],chan:r[4],rssi:r[5],lat:r[6],lon:r[7],type:r[8],obs:1}));
  document.getElementById('filebar').textContent='sample data — load a WiGLE v1.6 export to replace it';
  afterLoad();
}
function handleFiles(fileList){
  const files=[...fileList].filter(f=>/\.csv$/i.test(f.name));
  if(!files.length) return;
  document.getElementById('filebar').textContent='parsing '+files.length+' file(s)…';
  Promise.all(files.map(readFile)).then(texts=>{
    let recs=[];
    texts.forEach(t=>{recs=recs.concat(parseWigle(t));});
    if(!recs.length){alert('No WiFi/BLE rows with valid GPS coordinates were found in the selected file(s).');document.getElementById('filebar').textContent=files.map(f=>f.name).join(', ');return;}
    all=dedupe(recs);
    document.getElementById('filebar').textContent=files.map(f=>f.name).join(', ');
    afterLoad();
  }).catch(()=>alert('Could not read the selected file(s).'));
}
document.getElementById('fin').addEventListener('change',e=>handleFiles(e.target.files));
const mapwrap=document.getElementById('mapwrap'), dropEl=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>mapwrap.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('on');}));
mapwrap.addEventListener('dragleave',e=>{e.preventDefault();dropEl.classList.remove('on');});
mapwrap.addEventListener('drop',e=>{e.preventDefault();dropEl.classList.remove('on');if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});

function afterLoad(){
  selected=null;
  applyFilters(); fitToData(); updateHeaderStats(); renderTable(); updateInfoPanel(); render();
}
function fitToData(){
  if(!all.length) return;
  let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
  for(const p of all){if(p.lat<minLat)minLat=p.lat;if(p.lat>maxLat)maxLat=p.lat;if(p.lon<minLon)minLon=p.lon;if(p.lon>maxLon)maxLon=p.lon;}
  const w=(cv.width/DPR)||800, h=(cv.height/DPR)||600;
  let z=18;
  for(;z>1;z--){
    const p1=project(minLat,minLon,z), p2=project(maxLat,maxLon,z);
    if(Math.abs(p2.x-p1.x)<w*0.85 && Math.abs(p1.y-p2.y)<h*0.75) break;
  }
  view.zoom=z;
  const c=project((minLat+maxLat)/2,(minLon+maxLon)/2,z);
  view.cx=c.x; view.cy=c.y;
}
function updateHeaderStats(){
  const wifi=all.filter(p=>p.type==='WIFI').length, ble=all.filter(p=>p.type==='BLE').length;
  document.getElementById('qstats').innerHTML='<span><b>'+all.length+'</b> networks</span><span><b>'+wifi+'</b> wifi</span><span><b>'+ble+'</b> ble</span>';
}
function applyFilters(){
  filtered=all.filter(p=>{
    if(p.type==='WIFI'&&!filters.WIFI) return false;
    if(p.type==='BLE'&&!filters.BLE) return false;
    if(filters.OPENONLY && !(p.type==='WIFI'&&isOpen(p.auth))) return false;
    if(searchTerm && !((p.ssid||'').toLowerCase().includes(searchTerm)||(p.mac||'').toLowerCase().includes(searchTerm))) return false;
    return true;
  });
  sortFiltered();
}
function sortFiltered(){
  const key=sort.key, dir=sort.dir;
  filtered.sort((a,b)=>{
    let av=a[key],bv=b[key];
    if(typeof av==='string'){av=av.toLowerCase();bv=(bv||'').toLowerCase();return av<bv?-1*dir:av>bv?1*dir:0;}
    return ((av||0)-(bv||0))*dir;
  });
}
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    const k=ch.dataset.k;
    if(k==='OPEN'){filters.OPENONLY=!filters.OPENONLY;ch.classList.toggle('on',filters.OPENONLY);}
    else {filters[k]=!filters[k];ch.classList.toggle('on',filters[k]);}
    applyFilters();renderTable();updateInfoPanel();render();
  });
});
document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.trim().toLowerCase();
  applyFilters();renderTable();updateInfoPanel();render();
});
document.querySelectorAll('thead th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.s;
    if(sort.key===k) sort.dir*=-1; else {sort.key=k;sort.dir=k==='ssid'?1:-1;}
    sortFiltered();renderTable();
  });
});

function renderTable(){
  const tb=document.getElementById('tbody');
  const rows=filtered.slice(0,400);
  tb.innerHTML=rows.map((p,i)=>
    '<tr data-i="'+i+'" class="'+(p===selected?'sel':'')+'">'+
    '<td><span class="tyd" style="background:'+colorFor(p)+'"></span>'+esc(p.ssid)+'</td>'+
    '<td>'+esc(p.mac)+'</td>'+
    '<td>'+(isFinite(p.rssi)?p.rssi:'—')+'</td></tr>'
  ).join('')+(filtered.length>400?'<tr><td colspan="3" style="color:#5f776e;text-align:center;cursor:default">+'+(filtered.length-400)+' more — narrow with filters or search</td></tr>':'');
  tb.querySelectorAll('tr[data-i]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      selected=rows[+tr.dataset.i];
      flyTo(selected); renderTable(); updateInfoPanel(); render();
    });
  });
}
function flyTo(p){const pr=project(p.lat,p.lon,view.zoom);view.cx=pr.x;view.cy=pr.y;}

function updateInfoPanel(){
  const box=document.getElementById('statsbox');
  if(selected){
    const p=selected;
    box.innerHTML='<h2>Selected <span id="closeSel">&#10005;</span></h2>'+
      '<div class="statline"><span>SSID</span><b>'+esc(p.ssid)+'</b></div>'+
      '<div class="statline"><span>MAC</span><b>'+esc(p.mac)+'</b></div>'+
      '<div class="statline"><span>Type</span><b>'+p.type+'</b></div>'+
      '<div class="statline"><span>Security</span><b>'+(p.type==='WIFI'?(isOpen(p.auth)?'OPEN':esc(p.auth||'secured')):'—')+'</b></div>'+
      '<div class="statline"><span>Channel</span><b>'+esc(p.chan||'—')+'</b></div>'+
      '<div class="statline"><span>RSSI</span><b>'+(isFinite(p.rssi)?p.rssi+' dBm':'—')+'</b></div>'+
      '<div class="statline"><span>First seen</span><b>'+esc(p.seen||'—')+'</b></div>'+
      '<div class="statline"><span>Position</span><b>'+p.lat.toFixed(5)+', '+p.lon.toFixed(5)+'</b></div>'+
      '<div class="statline"><span>Observations</span><b>'+(p.obs||1)+'</b></div>';
    document.getElementById('closeSel').onclick=()=>{selected=null;renderTable();updateInfoPanel();render();};
  } else {
    const wifi=all.filter(p=>p.type==='WIFI').length, ble=all.filter(p=>p.type==='BLE').length;
    const open=all.filter(p=>p.type==='WIFI'&&isOpen(p.auth)).length;
    box.innerHTML='<h2>Summary</h2>'+
      '<div class="statline"><span>Unique networks</span><b>'+all.length+'</b></div>'+
      '<div class="statline"><span>WiFi</span><b>'+wifi+'</b></div>'+
      '<div class="statline"><span>BLE</span><b>'+ble+'</b></div>'+
      '<div class="statline warn"><span>Open WiFi</span><b>'+open+'</b></div>'+
      '<div class="statline"><span>Shown</span><b>'+filtered.length+'</b></div>';
  }
}

function render(){
  const w=cv.width/DPR, h=cv.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=BG; ctx.fillRect(0,0,w,h);
  const cluster=filtered.length>250, cellSize=40;
  const bins=cluster?new Map():null;
  let visCount=0;
  for(const p of filtered){
    const pr=project(p.lat,p.lon,view.zoom);
    const sx=w/2+(pr.x-view.cx), sy=h/2+(pr.y-view.cy);
    if(sx<-30||sx>w+30||sy<-30||sy>h+30){p._sx=null;continue;}
    p._sx=sx;p._sy=sy;
    if(cluster){
      const k=(sx/cellSize|0)+'_'+(sy/cellSize|0);
      let b=bins.get(k); if(!b){b={x:0,y:0,n:0,items:[]};bins.set(k,b);}
      b.x+=sx;b.y+=sy;b.n++;b.items.push(p);
    }
  }
  if(cluster){
    for(const b of bins.values()){
      if(b.n===1){drawPt(b.items[0]);visCount++;}
      else {drawCluster(b.x/b.n,b.y/b.n,b.n);visCount+=b.n;}
    }
  } else {
    for(const p of filtered){if(p._sx!=null){drawPt(p);visCount++;}}
  }
  drawScale(w,h);
  document.getElementById('stZoom').textContent='z'+view.zoom.toFixed(1);
  document.getElementById('stVis').textContent=visCount+' / '+filtered.length+' shown';
}
function drawPt(p){
  const r=p===selected?6:(p===hover?5:3.2);
  ctx.beginPath();ctx.fillStyle=colorFor(p);ctx.globalAlpha=0.88;
  ctx.arc(p._sx,p._sy,r,0,Math.PI*2);ctx.fill();
  if(p===selected){ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.globalAlpha=1;ctx.stroke();}
  ctx.globalAlpha=1;
}
function drawCluster(x,y,n){
  const r=Math.min(18,8+Math.log(n)*3);
  ctx.beginPath();ctx.fillStyle='rgba(51,214,160,.18)';ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.strokeStyle=COLORS.WIFI;ctx.lineWidth=1;ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#eafff5';ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(n,x,y);
}
function drawScale(w,h){
  const lat=unproject(w/2,h/2).lat;
  const mpp=156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,view.zoom);
  const steps=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000,200000];
  let dist=steps[0];
  for(const s of steps){if(s/mpp<=140)dist=s;}
  const px=dist/mpp;
  const x0=14,y0=h-16;
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+px,y0);ctx.moveTo(x0,y0-4);ctx.lineTo(x0,y0+4);ctx.moveTo(x0+px,y0-4);ctx.lineTo(x0+px,y0+4);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='10px ui-monospace,monospace';ctx.textAlign='left';
  ctx.fillText(dist>=1000?(dist/1000)+' km':dist+' m',x0,y0-8);
}

function handleHover(mx,my){
  let best=null,bd=144;
  for(const p of filtered){
    if(p._sx==null) continue;
    const dx=p._sx-mx,dy=p._sy-my,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=p;}
  }
  if(best!==hover){hover=best;render();}
  showTooltip(mx,my);
}
function showTooltip(mx,my){
  const tt=document.getElementById('tooltip');
  if(!hover){tt.style.display='none';return;}
  tt.style.display='block';
  tt.style.left=Math.min(mx+14,cv.clientWidth-240)+'px';
  tt.style.top=Math.min(my+14,cv.clientHeight-90)+'px';
  tt.innerHTML='<div class="tt-ssid">'+esc(hover.ssid)+'</div><div>'+hover.type+(hover.type==='WIFI'?(isOpen(hover.auth)?' · open':' · secured'):'')+' · '+(isFinite(hover.rssi)?hover.rssi+' dBm':'')+'</div><div>'+esc(hover.mac)+'</div>';
}
function handleClick(e){
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let best=null,bd=196;
  for(const p of filtered){
    if(p._sx==null) continue;
    const dx=p._sx-mx,dy=p._sy-my,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=p;}
  }
  selected=best; renderTable(); updateInfoPanel(); render();
}

cv.addEventListener('pointerdown',e=>{dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId);cv.classList.add('grabbing');});
cv.addEventListener('pointermove',e=>{
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const wc=unproject(mx,my);
  document.getElementById('stCoord').textContent='lat '+wc.lat.toFixed(5)+' lon '+wc.lon.toFixed(5);
  if(dragging){
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    view.cx-=dx;view.cy-=dy;lastX=e.clientX;lastY=e.clientY;render();
  } else {
    handleHover(mx,my);
  }
});
window.addEventListener('pointerup',e=>{if(dragging){dragging=false;cv.classList.remove('grabbing');if(!moved)handleClick(e);}});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const before=unproject(mx,my);
  view.zoom=clamp(view.zoom-e.deltaY*0.0025,2,20);
  const p=project(before.lat,before.lon,view.zoom);
  const w=cv.width/DPR,h=cv.height/DPR;
  view.cx=p.x-(mx-w/2);view.cy=p.y-(my-h/2);
  render();
},{passive:false});
function zoomBy(d){
  const w=cv.width/DPR,h=cv.height/DPR;
  const before=unproject(w/2,h/2);
  view.zoom=clamp(view.zoom+d,2,20);
  const p=project(before.lat,before.lon,view.zoom);
  view.cx=p.x;view.cy=p.y;render();
}
document.getElementById('zin').onclick=()=>zoomBy(1);
document.getElementById('zout').onclick=()=>zoomBy(-1);
document.getElementById('zfit').onclick=()=>{fitToData();render();};

function resize(){
  const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width)*DPR; cv.height=Math.max(1,r.height)*DPR;
  render();
}
window.addEventListener('resize',resize);
resize();
loadSample();
})();
</script>
</body>
</html>
